  'today-part': b => navigate('lift/' + b.dataset.g),
  'lift-home': () => navigate('lift'),
  'ex-demo': b => openDemo(b.dataset.eid, b.closest('.xcard, .exo-row') || b),
  'demo-pause': b => { const p = Body.pauseDemo(); b.innerHTML = p ? IC.play : IC.pause; b.setAttribute('aria-pressed', String(!!p)); b.setAttribute('aria-label', p ? '繼續示範' : '暫停示範'); },
  'demo-pick': b => {
    const id = b.dataset.eid, on = !UI.groupSelection.includes(id);
    setSelection(on ? [...UI.groupSelection, id] : UI.groupSelection.filter(x => x !== id));
    $$('[data-group-ex]').forEach(i => { if (i.dataset.groupEx === id) i.checked = on; });
    toast(on ? '已加入選擇，在重訓頁按「開始訓練」' : '已從選擇移除'); rerenderSheet();
  },
  'lift-zone': b => {
    const z = b.dataset.z || '', g = UI.liftGroup || ZONE[z]?.g; if (!g) return;
    Store.set('hint-zone', true);
    navigate(!z || z === UI.liftZone ? 'lift/' + g : `lift/${g}/${z}`, true);
  },
  'zone-scroll': () => $('#exList')?.scrollIntoView({ behavior: RM.matches ? 'auto' : 'smooth', block: 'start' }),
  'body-heat': b => {
    UI.heatOn = !UI.heatOn; Store.set('body-heat', UI.heatOn); Body.setHeatOn(UI.heatOn);
    b.setAttribute('aria-pressed', String(UI.heatOn)); if (UI.load) stageChrome(UI.load);
    toast(UI.heatOn ? '標示本週練過的肌肉' : '已關閉練過標示');
  },
  'tray-clear': () => { setSelection([]); $$('[data-group-ex]').forEach(i => { i.checked = false; }); },
  'group-start': () => {
    const ids = UI.groupSelection.filter(id => S.exercises.some(e => e.id === id));
    if (!ids.length) return;
    const title = selectionTitle(ids);
    setSelection([]);
    startSession({ eids: ids, title });
  },
  'run-new': () => navigate('run/new'),
  'run-home': () => navigate('run'),
  'run-history': () => navigate('run/history'),
  'run-trends': () => navigate('run/trends'),
  'score-open': () => { UI.scoreReturn = UI.tab === 'score' ? UI.scoreReturn : location.hash.slice(1) || 'today'; navigate('score'); },
  'score-back': () => navigate(UI.scoreReturn || 'today'),
  'tpl-open': b => openTemplate(+b.dataset.i, b),
  'tpl-start': b => { const t = S.templates[+b.dataset.i]; closeSheet(true); startSession({ tplId: t.id }); },
  'tpl-rm': b => { const t = S.templates[+b.dataset.i]; t.ex = t.ex.filter(e => e !== b.dataset.eid); commit(); rerenderSheet(); },
  'tpl-add': b => { const i = +b.dataset.i; closeSheet(true); openPicker({ mode: 'tpl', i }); },
  'start-blank': () => startSession({}),
  'reuse-edit': b => startFromHistory(b.dataset.id),
  'reuse-log': b => openQuickLog(b.dataset.id, b),
  'reuse-confirm': b => logHistoryCopy(b.dataset.id),
  'x-use-last': b => {
    const xi = +b.dataset.xi, it = S.active?.items[xi];
    if (!it) return;
    const previous = lastPerf(it.eid, S.active.editId);
    if (!previous) { toast('這個動作沒有上次紀錄'); return; }
    // Replacing current work requires a second click; simple empty drafts fill immediately.
    if (it.sets.some(s => s.done || num(s.w) != null || num(s.r) != null) && !armed(b, '再按一次，覆蓋目前組數')) return;
    it.sets = copyPreviousItems({ items: [previous.item] })[0]?.sets || it.sets;
    commit({ quiet: true }); refreshCard(xi);
    toast('已套用上次重量與次數');
  },
  'add-ex': () => openPicker({ mode: 'session' }),
  'pick-g': b => { UI.picker.g = b.dataset.g; $$('.chip', sheetCur.body).forEach(c => c.setAttribute('aria-pressed', String(c === b))); fillPicker(); },
  'pick-ex': b => pickExercise(b.dataset.eid),
  'new-ex': () => {
    const name = $('#newEx').value.trim(); if (!name) { $('#newEx').focus(); return; }
    let e = S.exercises.find(x => x.name === name);
    if (!e) { e = { id: 'c-' + uid(), name, group: $('#newExG').value, bw: false, unit: 'rep', custom: true }; S.exercises.push(e); }
    commit({ quiet: true });
    pickExercise(e.id);
  },
  'set-done': b => {
    const row = b.closest('.set-row'), it = S.active.items[+row.dataset.xi], s = it.sets[+row.dataset.si];
    if (!s.done) {
      if (num(s.r) == null && num(s.pr) == null) { toast('先填這組的次數'); $('input[data-f="r"]', row)?.focus(); return; }
      if (num(s.w) == null && s.pw != null) s.w = s.pw;
      if (num(s.r) == null) s.r = s.pr;
      s.done = true;
      if (!s.warm) Rest.start(S.profile.rest || 120);
    } else s.done = false;
    commit({ quiet: true }); refreshCard(+row.dataset.xi);
  },
  'set-warm': b => {
    const row = b.closest('.set-row'), s = S.active.items[+row.dataset.xi].sets[+row.dataset.si];
    s.warm = !s.warm; commit({ quiet: true }); refreshCard(+row.dataset.xi);
  },
  'add-set': b => {
    const it = S.active.items[+b.dataset.xi], last = it.sets[it.sets.length - 1];
    it.sets.push(last ? { w: null, r: null, rpe: '', warm: false, done: false, pw: num(last.w) ?? last.pw ?? null, pr: num(last.r) ?? last.pr ?? null } : { w: null, r: null, rpe: '', warm: false, done: false, pw: null, pr: 10 });
    commit({ quiet: true }); refreshCard(+b.dataset.xi);
    const rows = $$(`.set-row[data-xi="${b.dataset.xi}"]`); $('input[data-f="w"]', rows[rows.length - 1])?.focus({ preventScroll: true });
  },
  'x-menu': b => { const i = +b.dataset.xi; const p = UI.xmenu; UI.xmenu = p === i ? -1 : i; if (p >= 0 && p !== i) refreshCard(p); refreshCard(i); },
  'x-delset': b => { const it = S.active.items[+b.dataset.xi]; it.sets.pop(); commit({ quiet: true }); refreshCard(+b.dataset.xi); },
  'x-move': b => {
    const i = +b.dataset.xi, j = i + +b.dataset.d, a = S.active.items;
    if (j < 0 || j >= a.length) return;
    [a[i], a[j]] = [a[j], a[i]]; UI.xmenu = j; commit({ quiet: true }); renderSession(false);
  },
  'x-remove': b => { if (!armed(b)) return; S.active.items.splice(+b.dataset.xi, 1); UI.xmenu = -1; commit({ quiet: true }); renderSession(false); },
  finish: b => finishSession(b),
  discard: b => {
    if (!armed(b, S.active?.editId ? '再按一次，放棄修改' : '再按一次，捨棄這次訓練')) return;
    S.active = null; UI.xmenu = -1; Rest.stop(); Wake.off(); commit(); scrollTo(0, 0);
  },
  'rest-adj': b => Rest.adj(+b.dataset.d),
  'rest-stop': () => Rest.stop(),
  'run-save': () => saveRun(),
  'mode-flip': () => { const d = UI.runDraft; const cur = d.modeOverride || detectMode(num(d.km), draftSec(d), num(d.cad)); d.modeOverride = cur === 'walk' ? 'run' : 'walk'; $('#paceBox').innerHTML = paceHTML(d); Store.set('run-draft', d); },
  'fit-info': b => openFitInfo(b),
  'cmp-info': b => openCmpInfo(b),
  'entry-cmp': b => { const k = b.dataset.k, id = b.dataset.id; closeSheet(true); openCompare(k, id, null); },
  'cmp-profile': () => {
    const by = num($('#cf-by')?.value), sx = $('#cf-sx')?.value, bw = num($('#cf-bw')?.value), y = new Date().getFullYear();
    if (!(by > 1920 && by <= y - 8)) { toast('請填正確的出生年'); $('#cf-by')?.focus(); return; }
    if (!sx) { toast('請選性別'); return; }
    if (!(bw > 25 && bw < 260)) { toast('請填體重（公斤）'); $('#cf-bw')?.focus(); return; }
    S.profile.birthYear = Math.round(by); S.profile.sex = sx; S.profile.bw = Math.round(bw * 10) / 10;
    commit({ quiet: true }); rerenderSheet();
  },
  'geo-here': b => geoHere(b),
  'place-pick': b => { const s = sugList[+b.dataset.i]; if (s) setPlace(s.name, s.lat, s.lon); },
  'wl-next': () => Welcome.next(),
  'wl-skip': () => Welcome.close(false),
  'wl-done': () => Welcome.close(true),
  'wl-show': () => { closeSheet(true); Welcome.open(); },
  'run-cancel': () => { UI.runDraft = newRunDraft(); Store.set('run-draft', null); navigate('run'); },
  month: b => {
    const [y, m] = UI.logMonth.split('-').map(Number); const d = new Date(y, m - 1 + +b.dataset.d, 1);
    UI.logMonth = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`; UI.logDay = null; renderLog(false);
  },
  day: b => { const d = b.dataset.d || null; UI.logDay = UI.logDay === d ? null : d; if (d && !d.startsWith(UI.logMonth)) UI.logMonth = d.slice(0, 7); renderLog(false); },
  'entry-del': b => {
    if (!armed(b)) return;
    const k = b.dataset.k, id = b.dataset.id;
    if (k === 'lift') S.lifts = S.lifts.filter(l => l.id !== id); else S.runs = S.runs.filter(r => r.id !== id);
    closeSheet(); commit(); toast('已刪除');
  },
  'entry-edit': b => {
    const k = b.dataset.k, id = b.dataset.id;
    if (k === 'run') {
      const r = S.runs.find(x => x.id === id); if (!r) return;
      UI.runDraft = { date: r.date, km: String(r.km), h: String(Math.floor(r.sec / 3600) || ''), m: String(Math.floor(r.sec % 3600 / 60)), s: String(Math.round(r.sec % 60)), type: r.type, feel: String(r.feel || '3'), hr: r.hr ?? '', cad: r.cad ?? '', shoe: r.shoe || '', place: r.place || '', lat: r.lat ?? null, lon: r.lon ?? null, time: r.time || '', weather: r.weather || null, wxState: r.weather ? 'ok' : 'idle', note: r.note || '', editId: r.id };
      { const auto = detectMode(r.km, r.sec, r.cad), m = r.type === 'walk' ? 'walk' : 'run'; UI.runDraft.modeOverride = auto && auto !== m ? m : null; if (r.type === 'walk') UI.runDraft.type = 'easy'; }
      Store.set('run-draft', UI.runDraft);
      closeSheet(true); navigate('run/new');
      return;
    }
    if (S.active) { toast('先完成或捨棄進行中的訓練'); return; }
    const l = S.lifts.find(x => x.id === id); if (!l) return;
    S.active = { id: l.id, editId: l.id, tpl: l.tpl, title: l.title, date: l.date, start: l.start, durMin: Math.round(l.dur / 60), note: l.note || '', items: l.items.map(it => ({ eid: it.eid, sets: it.sets.map(s => ({ w: s.w, r: s.r, rpe: s.rpe || '', warm: !!s.warm, done: true, pw: null, pr: null })) })) };
    commit({ quiet: true }); closeSheet(true);
    if (UI.tab === 'lift') renderLift(true); else go('lift');
  },
  'entry-repeat': b => {
    const l = S.lifts.find(x => x.id === b.dataset.id); if (!l) return;
    if (S.active) { toast('先完成或捨棄進行中的訓練'); return; }
    startFromHistory(l.id);
  },
  'backup-copy': async b => {
    const text = JSON.stringify(S);
    try { await navigator.clipboard.writeText(text); toast('備份已複製，貼到記事本或雲端硬碟存好'); }
    catch (e) { const box = $('#backupBox'); box.value = text; box.focus(); box.select(); toast('無法直接複製，已選取備份文字，請手動複製'); }
  },
  'backup-import': () => { const t = $('#backupBox').value.trim(); if (!t) { toast('先把備份文字貼進框框'); $('#backupBox').focus(); return; } importBackup(t); },
  'reset-all': b => {
    if (!armed(b, '再按一次，全部清除')) return;
    const keep = S.profile; S = freshState(); S.profile = keep; S.exCleared = true;
    Rest.stop(); commit(); closeSheet(); toast('所有紀錄已清除');
  },
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const fn = ACT[b.dataset.act];
  if (fn) fn(b, e);
});

/* ---------- inputs ---------- */
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.f && S.active) {
    const row = t.closest('.set-row'); if (!row) return;
    const s = S.active.items[+row.dataset.xi]?.sets[+row.dataset.si]; if (!s) return;
    const v = t.value.trim();
    s[t.dataset.f] = t.dataset.f === 'rpe' ? v : (v === '' ? null : num(v));
    commit({ lazy: true, quiet: true });
    if (s.done) updateSessTotals();
  } else if (t.dataset.sf && S.active) {
    S.active[t.dataset.sf] = t.value;
    commit({ lazy: true, quiet: true });
  } else if (t.dataset.rf && UI.runDraft) {
    UI.runDraft[t.dataset.rf] = t.value;
    if (['km', 'h', 'm', 's', 'cad'].includes(t.dataset.rf)) $('#paceBox').innerHTML = paceHTML(UI.runDraft);
    if (t.dataset.rf === 'place') placeTyped(t.value);
    Store.set('run-draft', UI.runDraft);
  } else if (t.matches('[data-pick-q]') && UI.picker) {
    UI.picker.q = t.value; fillPicker();
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.pf) {
    const k = t.dataset.pf;
    if (k === 'name') S.profile.name = t.value.trim() || '林哲愷';
    else if (k === 'sex') S.profile.sex = t.value || null;
    else if (k === 'birthYear') { const n = num(t.value), y = new Date().getFullYear(); S.profile.birthYear = n && n > 1920 && n <= y - 8 ? Math.round(n) : null; if (!S.profile.birthYear) t.value = ''; }
    else if (k === 'bw') { const n = num(t.value); S.profile.bw = n && n > 25 && n < 260 ? Math.round(n * 10) / 10 : null; if (!S.profile.bw) t.value = ''; }
    else { const n = num(t.value); if (n != null && n > 0) S.profile[k] = k === 'goalKm' ? Math.round(n * 10) / 10 : Math.round(n); else t.value = S.profile[k]; }
    commit();
  } else if (t.id === 'importFile' && t.files?.[0]) {
    const fr = new FileReader();
    fr.onload = () => importBackup(String(fr.result || ''));
    fr.onerror = () => toast('讀不到這個檔案');
    fr.readAsText(t.files[0]);
  } else if ((t.dataset.rf === 'date' || t.dataset.rf === 'time') && UI.runDraft) {
    UI.runDraft[t.dataset.rf] = t.value; Store.set('run-draft', UI.runDraft); if (UI.runDraft.lat != null) refreshWeather();
  } else if (t.dataset.sf === 'date' && S.active) {
    S.active.date = t.value || todayISO(); commit({ quiet: true });
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'rf-place') {
    e.preventDefault();
    if (sugList.length) { const s = sugList[0]; setPlace(s.name, s.lat, s.lon); }
    else geoSearch(e.target.value.trim()).then(l => { if (l[0]) setPlace(l[0].name, l[0].lat, l[0].lon); else toast('找不到這個地點'); }).catch(() => toast('連不上地點搜尋'));
    return;
  }
  if (e.key === 'Enter' && e.target.matches?.('.set-row input')) {
    e.preventDefault();
    const ins = $$('#liftSession .set-row input'); const i = ins.indexOf(e.target);
    ins[i + 1]?.focus();
  }
});

/* ---------- iOS niceties ---------- */
const COARSE = matchMedia('(pointer: coarse)');
const isField = el => el && el.matches?.('input:not([type="checkbox"]):not([type="radio"]):not([type="file"]), textarea, select');
document.addEventListener('focusin', e => { if (COARSE.matches && isField(e.target)) document.documentElement.classList.add('kb'); });
document.addEventListener('focusout', () => setTimeout(() => { if (!isField(document.activeElement)) document.documentElement.classList.remove('kb'); }, 60));
// Safari already scrolls focused inputs into view. Repeated visualViewport-resize
// scrollIntoView(center, smooth) caused bouncing while the keyboard opened.
// Leave native keyboard handling in control instead of forcing any zoom/scroll.
// lock page scroll behind sheets so iOS doesn't scroll the page underneath
new MutationObserver(() => document.documentElement.classList.toggle('locked', !!document.querySelector('.sheet-wrap'))).observe(document.body, { childList: true });
// "next" key on the number pad moves through set inputs
document.addEventListener('focusin', e => { if (e.target.matches?.('.set-row input')) e.target.setAttribute('enterkeyhint', 'next'); });

document.addEventListener('change', e => {
  const box = e.target.closest?.('[data-group-ex]');
  if (!box) return;
  const id = box.dataset.groupEx, next = UI.groupSelection.filter(x => x !== id);
  if (box.checked) next.push(id);
  setSelection(next);
  $$('[data-group-ex]').forEach(i => { if (i.dataset.groupEx === id) i.checked = box.checked; });
});

/* ---------- boot ---------- */
UI.groupSelection = UI.groupSelection.filter(id => S.exercises.some(e => e.id === id));
Strava.callback();
renderToday(true);
$('#brandName').textContent = `${firstName() || '我的'}訓練日誌`;
Lens.init();
if (!Store.get('welcomed', false)) Welcome.open();
applyRoute();
if (S.active && !S.active.editId) Wake.on();
</script>

</body>
</html>
