<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>哲愷訓練日誌</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#F4EFE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12110F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="訓練日誌">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&family=Nunito:wght@600;700;800&display=swap">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  /* Layout: Apple-Fitness-style grouped sheets — borderless rounded cards on linen, large left titles, activity rings.
     Linen white leads; deep blue = lifting, bright yellow = running, black = exercise time. Glass only on nav + controls. */
  --bg:#F4EFE6; --bg-a:#DFE6EF; --bg-b:#FBEFB5; --bg-c:#FBEDC2;
  --paper:#FFFDF9; --paper-2:#F1ECE3; --ink:#1D1B18; --ink-2:#6B655C; --ink-3:#9E978C; --line:#E9E3D8;
  --lift:#1F3A5F; --lift-2:#1F3A5F; --lift-soft:#E3E8EF;
  --run:#FFD60A; --run-2:#1A1A1A; --run-soft:#FFF3B8;
  --time:#1A1A1A; --time-ink:#1A1A1A; --time-soft:#E4DED3; --on-run:#111111;
  --yellow:#FFD60A; --yellow-ink:#1A1A1A; --yellow-soft:#FFF3B8;
  --violet:#1A1A1A; --violet-soft:#FFF3B8;
  --ok:#2E8F68; --warn:#A8730F; --warn-soft:#FBEFD2; --bad:#C94545; --bad-soft:#FAE3E1;
  --on-acc:#FFFFFF;
  --glass:rgba(255,252,246,.6); --glass-hi:rgba(255,255,255,.92); --glass-lo:rgba(255,255,255,.25); --glass-shade:rgba(60,50,35,.16); --glass-inset:rgba(60,50,35,.07);
  --pill:rgba(255,253,248,.8);
  --spot:rgba(31,58,95,.06);
  --scrim:rgba(40,34,26,.24);
  --shadow:none;
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC",system-ui,sans-serif;
  --f-num:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,"PingFang TC","Noto Sans TC",sans-serif;
  --f-en:-apple-system,BlinkMacSystemFont,"SF Pro Text","Nunito","Helvetica Neue",Arial,sans-serif;
  --spring:cubic-bezier(.3,1.18,.5,1);
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12110F; --bg-a:#18212C; --bg-b:#2E2810; --bg-c:#30291A;
    --paper:#1E1C19; --paper-2:#2A2723; --ink:#F4EFE6; --ink-2:#B5AEA2; --ink-3:#7D766B; --line:#33302B;
    --lift:#8FB0DA; --lift-2:#A9C3E6; --lift-soft:#1C2633;
    --run:#FFD60A; --run-2:#FFD60A; --run-soft:#3A3212;
    --time:#EDE6D8; --time-ink:#EDE6D8; --time-soft:#2E2B26; --on-run:#111111;
    --yellow:#FFD60A; --yellow-ink:#FFD60A; --yellow-soft:#3A3212;
    --violet:#FFD60A; --violet-soft:#3A3212;
    --ok:#62CFA0; --warn:#F2C566; --warn-soft:#3E3420; --bad:#FF8A80; --bad-soft:#4A2626;
    --on-acc:#12110F;
    --glass:rgba(38,35,31,.55); --glass-hi:rgba(255,255,255,.26); --glass-lo:rgba(255,255,255,.07); --glass-shade:rgba(0,0,0,.5); --glass-inset:rgba(0,0,0,.28);
    --pill:rgba(255,255,255,.14);
    --spot:rgba(143,176,218,.06);
    --scrim:rgba(0,0,0,.5);
    --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#12110F; --bg-a:#18212C; --bg-b:#2E2810; --bg-c:#30291A;
    --paper:#1E1C19; --paper-2:#2A2723; --ink:#F4EFE6; --ink-2:#B5AEA2; --ink-3:#7D766B; --line:#33302B;
    --lift:#8FB0DA; --lift-2:#A9C3E6; --lift-soft:#1C2633;
    --run:#FFD60A; --run-2:#FFD60A; --run-soft:#3A3212;
    --time:#EDE6D8; --time-ink:#EDE6D8; --time-soft:#2E2B26; --on-run:#111111;
    --yellow:#FFD60A; --yellow-ink:#FFD60A; --yellow-soft:#3A3212;
    --violet:#FFD60A; --violet-soft:#3A3212;
    --ok:#62CFA0; --warn:#F2C566; --warn-soft:#3E3420; --bad:#FF8A80; --bad-soft:#4A2626;
    --on-acc:#12110F;
    --glass:rgba(38,35,31,.55); --glass-hi:rgba(255,255,255,.26); --glass-lo:rgba(255,255,255,.07); --glass-shade:rgba(0,0,0,.5); --glass-inset:rgba(0,0,0,.28);
    --pill:rgba(255,255,255,.14);
    --spot:rgba(143,176,218,.06);
    --scrim:rgba(0,0,0,.5);
    --shadow:none;
    color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--f-ui); font-size:15px; line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:0;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.5;
  background:
    radial-gradient(42% 34% at 12% 8%, var(--bg-a), transparent 72%),
    radial-gradient(40% 32% at 92% 34%, var(--bg-b), transparent 72%),
    radial-gradient(55% 38% at 40% 104%, var(--bg-c), transparent 70%);
}
button{font:inherit; color:inherit}
input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--lift); outline-offset:2px}
::selection{background:var(--lift-soft)}

/* ---------- type ---------- */
.eyebrow{font:600 11px/1.3 var(--f-en); letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3)}
.title{font-weight:800; font-size:clamp(26px, 6.4vw, 32px); line-height:1.12; letter-spacing:.01em; margin:2px 0 0; text-wrap:balance}
.sec{font-weight:800; font-size:17px; line-height:1.3; margin:0; text-wrap:balance}
.num{font-family:var(--f-num); font-variant-numeric:tabular-nums; font-weight:700; letter-spacing:.01em}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.small{font-size:12.5px}
.unit{font:600 12px var(--f-en); letter-spacing:.06em; color:var(--ink-3); margin-left:3px}

/* ---------- layout ---------- */
.main{max-width:760px; margin:0 auto; padding-block:10px calc(132px + env(safe-area-inset-bottom,0px))}
.view{display:flex; flex-direction:column; gap:16px}
.head{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:8px 2px 0}
.head > div{min-width:0}
.card{position:relative; background:var(--paper); border:1px solid var(--line); border-radius:18px; padding:18px; box-shadow:var(--shadow); min-width:0}
.card-h{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px}
.grid2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
.grid3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px}
@media (max-width:540px){
  .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid3 > :last-child:nth-child(odd){grid-column:1 / -1}
}
.row{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.grid2 > *, .grid3 > *, .timeboxes > *{min-width:0}
.spacer{flex:1}

/* ---------- glass (nav + control layer only) ---------- */
.glass{
  position:relative;
  background:var(--glass);
  -webkit-backdrop-filter:blur(22px) saturate(185%);
  backdrop-filter:blur(22px) saturate(185%);
  box-shadow:
    inset 0 1px 0 var(--glass-hi),
    inset 0 -10px 18px -14px var(--glass-inset),
    inset 0 0 0 1px var(--glass-lo),
    0 12px 30px -14px var(--glass-shade);
}
.glass::before{
  content:""; position:absolute; inset:0; border-radius:inherit; padding:1px; pointer-events:none;
  background:linear-gradient(140deg, var(--glass-hi), transparent 36%, transparent 64%, var(--glass-hi));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask-composite:exclude;
}
.gbtn{
  width:40px; height:40px; border-radius:50%; border:0; display:grid; place-items:center; cursor:pointer;
  color:var(--ink); transition:scale .3s var(--spring), color .2s;
  -webkit-tap-highlight-color:transparent;
}
.gbtn svg{width:20px; height:20px}
.gbtn:active{scale:1.14}
.gbtn[aria-pressed="true"]{color:var(--lift)}

/* top bar */
.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:50; padding-top:10px; max-width:760px; margin:0 auto}
.topbar-in{display:flex; align-items:center; gap:10px; padding:6px 6px 6px 10px; border-radius:999px}
.brand{display:flex; align-items:center; gap:9px; min-width:0; flex:1; text-decoration:none}
.brand canvas{width:30px; height:30px; flex:none}
.brand-t{display:flex; flex-direction:column; min-width:0; line-height:1.15}
.brand-t b{font-weight:900; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.brand-t span{font:600 9px/1.2 var(--f-en); letter-spacing:.2em; color:var(--ink-3)}
.tb-actions{display:flex; gap:6px}

/* ---------- segmented control with shared glass capsule ---------- */
.gseg{display:block; border-radius:999px; padding:4px; touch-action:pan-y; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent}
.gseg-row{position:relative; display:flex; align-items:stretch}
.gseg-item{
  flex:1 1 0; min-width:0; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  padding:8px 12px; border:0; background:none; border-radius:999px; cursor:pointer; white-space:nowrap;
  color:var(--ink-2); font:600 13px/1.25 var(--f-ui); transition:opacity .3s .05s, color .25s;
}
.gseg-item.under{opacity:0; transition:opacity .1s}
.gseg-item:focus-visible{outline-offset:-3px}
.gseg-pill{
  position:absolute; left:0; top:0; bottom:0; width:0; border-radius:999px; overflow:hidden; pointer-events:none; z-index:2;
  background:var(--pill);
  box-shadow:
    inset 0 1px 0 var(--glass-hi),
    inset 0 -6px 12px -8px var(--glass-inset),
    inset 0 0 0 1px var(--glass-lo),
    0 6px 16px -8px var(--glass-shade);
  transition:transform .55s var(--spring), width .55s var(--spring), scale .32s var(--spring);
  will-change:transform;
}
.gseg-pill::after{content:""; position:absolute; inset:0; border-radius:inherit; background:radial-gradient(70% 55% at 30% 0%, var(--glass-hi), transparent 70%); opacity:.55; pointer-events:none}
.gseg-scale{position:absolute; inset:0; transform:scale(1.12); transform-origin:50% 50%}
.gseg-clone{position:absolute; left:0; top:0; display:flex; transition:transform .55s var(--spring)}
.gseg-clone .gseg-item{color:var(--acc, var(--lift)); cursor:default; opacity:1}
.gseg.pressing .gseg-pill{scale:1.12}
.gseg.dragging .gseg-pill{transition-property:scale}
.gseg.dragging .gseg-clone{transition:none}
.gseg.noanim .gseg-pill, .gseg.noanim .gseg-clone{transition:none}
.gl{display:block; height:15px; overflow:hidden; line-height:15px}
.gl-in{display:flex; flex-direction:column; transition:translate .35s var(--ease)}
.gl-in > span{height:15px; display:block}
.gl-in .en{font:600 9.5px/15px var(--f-en); letter-spacing:.18em}
@media (hover:hover){ .gseg-item:hover .gl-in, .tpl-pill:hover .gl-in{translate:0 -15px} }
.gi{display:block; line-height:0}
.gi svg{width:22px; height:22px}

/* segments sitting on paper: a recessed track so the shared capsule stays visible */
.card .gseg, .sheet .gseg{background:var(--paper-2); -webkit-backdrop-filter:none; backdrop-filter:none; box-shadow:inset 0 0 0 1px var(--line)}
.card .gseg::before, .sheet .gseg::before{display:none}
.card .gseg-pill, .sheet .gseg-pill{background:var(--paper); box-shadow:inset 0 1px 0 var(--glass-hi), inset 0 0 0 1px var(--line), 0 6px 14px -6px var(--glass-shade)}
/* small inline segments inside content */
.seg-sm .gseg-item{padding:7px 10px; font-size:12.5px}
.seg-sm .gl{height:auto; overflow:visible}

/* tab bar */
#tabbar{
  position:fixed; z-index:60; left:50%; translate:-50% 0;
  bottom:calc(12px + env(safe-area-inset-bottom,0px));
  width:min(460px, calc(100% - 2 * max(16px, env(safe-area-inset-left,0px))));
}
#tabbar .gseg{padding:5px}
#tabbar .gseg-item{gap:3px; padding:7px 2px 6px; font-size:11px}
#tabbar .gi svg{width:23px; height:23px}
#tabbar .gl{transition:opacity .25s}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 18px; border-radius:999px; border:0; cursor:pointer;
  font-weight:700; font-size:15px; text-decoration:none; transition:scale .3s var(--spring), background .2s, opacity .2s; -webkit-tap-highlight-color:transparent;
}
.btn:active{scale:1.05}
.btn svg{width:18px; height:18px}
.btn-lift{background:var(--lift); color:var(--on-acc); box-shadow:0 10px 24px -12px var(--lift)}
.btn-run{background:var(--run); color:var(--on-acc); box-shadow:0 10px 24px -12px var(--run)}
.btn-soft{background:var(--paper-2); color:var(--ink); border:1px solid var(--line)}
.btn-ghost{background:none; color:var(--ink-2); padding:0 10px}
.btn-danger{background:var(--bad-soft); color:var(--bad)}
.btn-danger.armed{background:var(--bad); color:var(--on-acc)}
.btn-block{width:100%}
.btn[disabled]{opacity:.45; pointer-events:none}
.btn-glass{color:var(--ink); background:var(--glass)}
.link{background:none; border:0; padding:0; color:var(--lift-2); font-weight:700; cursor:pointer; font-size:13.5px}

/* big start tiles */
.starts{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
.start{
  position:relative; display:flex; flex-direction:column; align-items:flex-start; gap:10px; padding:16px; min-height:112px; border-radius:24px; border:0; cursor:pointer; text-align:left;
  transition:scale .35s var(--spring); -webkit-tap-highlight-color:transparent; overflow:hidden;
}
.start:active{scale:1.04}
.start .s-ico{width:38px; height:38px; border-radius:50%; display:grid; place-items:center; background:var(--glass-hi); color:var(--acc)}
.start .s-ico svg{width:20px; height:20px}
.start b{font-size:17px; font-weight:900; line-height:1.2}
.start span{font-size:12px; color:var(--ink-2)}

.start-lift{--acc:var(--lift-2); background:var(--lift-soft)}
.start-run{--acc:var(--run-2); background:var(--run-soft)}

/* ---------- spotlight cards ---------- */
.spot{isolation:isolate}
.spot::before{
  content:""; position:absolute; inset:0; border-radius:inherit; z-index:-1; pointer-events:none;
  background:radial-gradient(240px circle at var(--mx,-400px) var(--my,-400px), var(--spot), transparent 65%);
  opacity:0; transition:opacity .3s;
}
.spot:hover::before{opacity:1}

/* ---------- blur-fade ---------- */
.bf{animation:bf .45s var(--ease) both; animation-delay:calc(var(--i, 0) * 40ms)}
@keyframes bf{from{opacity:0; filter:blur(6px); transform:translateY(6px)}}

/* ---------- banner ---------- */
.banner{display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:12px 14px; border-radius:18px; background:var(--violet-soft); border:0; font-size:13.5px}
.banner p{margin:0; flex:1 1 220px; min-width:0}

/* this-week figures */
.stats3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); margin-top:16px; padding-top:14px; border-top:1px solid var(--line)}
.stats3 > div{display:flex; flex-direction:column; gap:3px; padding:0 12px; min-width:0}
.stats3 > div:first-child{padding-left:0}
.stats3 > div + div{border-left:1px solid var(--line)}
.stats3 .tl{font-size:12px; color:var(--ink-2)}
.stats3 .tv{font:700 26px/1.1 var(--f-num); font-variant-numeric:tabular-nums; white-space:nowrap}
.stats3 .unit{font-size:11px}
@media (max-width:420px){ .stats3 > div{padding:0 8px} .stats3 .tv{font-size:22px} }
#rest:not([hidden]){animation:restIn .38s var(--ease)}
@keyframes restIn{from{opacity:0; transform:translateY(10px)}}
/* week strip */
.week{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px}
.wd{display:flex; flex-direction:column; align-items:center; gap:6px; padding:9px 0 10px; border-radius:16px; background:var(--paper-2); min-width:0}
.wd .w1{font-size:11px; color:var(--ink-3)}
.wd .w2{font:700 18px/1 var(--f-num)}
.wd .dots{display:flex; gap:3px; height:7px}
.wd .dot{width:7px; height:7px; border-radius:50%}
.wd.today{background:var(--ink); color:var(--paper)}
.wd.today .w1{color:var(--paper); opacity:.7}
.dot.l{background:var(--lift)} .dot.r{background:var(--run)}

/* stat tiles */
.tile{display:flex; flex-direction:column; gap:4px}
.tile .tv{font:700 34px/1.05 var(--f-num); font-variant-numeric:tabular-nums; letter-spacing:.005em}
.tile .tl{font-size:12.5px; color:var(--ink-2)}
.meter{height:6px; border-radius:6px; background:var(--paper-2); overflow:hidden; margin-top:6px}
.meter i{display:block; height:100%; border-radius:6px; background:linear-gradient(90deg, var(--lift), var(--bg-c) 50%, var(--run))}

/* entry list */
.list{display:flex; flex-direction:column; gap:10px}
.entry{
  display:grid; grid-template-columns:44px minmax(0,1fr) auto; gap:12px; align-items:center; text-align:left; width:100%;
  padding:12px 14px; border-radius:18px; background:var(--paper); border:1px solid var(--line); cursor:pointer; box-shadow:var(--shadow);
  transition:scale .3s var(--spring);
}
.entry:active{scale:.985}
.entry .e-ico{width:44px; height:44px; border-radius:14px; display:grid; place-items:center}
.entry .e-ico svg{width:21px; height:21px}
.entry.k-lift .e-ico{background:var(--lift-soft); color:var(--lift-2)}
.entry.k-run .e-ico{background:var(--run-soft); color:var(--run-2)}
.entry .e-t{font-weight:800; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.entry .e-s{font-size:12.5px; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.entry .e-v{text-align:right; font:700 20px/1 var(--f-num); font-variant-numeric:tabular-nums}
.entry .e-v small{display:block; font:600 10px/1.6 var(--f-en); letter-spacing:.1em; color:var(--ink-3)}
.tag{display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700; background:var(--paper-2); color:var(--ink-2)}
.tag.ex{background:var(--violet-soft); color:var(--violet)}
.tag.pr{background:var(--warn-soft); color:var(--warn)}
.empty{padding:22px; text-align:center; color:var(--ink-3); border:1px dashed var(--line); border-radius:18px; font-size:13.5px}

/* ---------- card box ---------- */
.boxwrap{position:relative; height:clamp(320px, 66vw, 440px); border-radius:28px; overflow:hidden; border:1px solid var(--line); background:var(--bg); box-shadow:var(--shadow); isolation:isolate}
.boxwrap canvas{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:pan-y}
@media (pointer:fine){ .boxwrap.gl-on canvas{cursor:none} }
.box-tag{position:absolute; left:16px; top:14px; z-index:2; pointer-events:none}
.box-hint{position:absolute; left:16px; right:16px; bottom:12px; z-index:2; pointer-events:none; font-size:12px; color:var(--ink-3); text-align:center}
.cur-ring,.cur-dot{position:absolute; left:0; top:0; z-index:3; pointer-events:none; border-radius:50%; opacity:0; transition:opacity .2s}
.cur-ring{width:36px; height:36px; margin:-18px 0 0 -18px; border:1.5px solid var(--ink-2); transition:opacity .2s, width .35s var(--spring), height .35s var(--spring), margin .35s var(--spring), border-color .25s}
.cur-dot{width:6px; height:6px; margin:-3px 0 0 -3px; background:var(--ink)}
.boxwrap.cur-on .cur-ring, .boxwrap.cur-on .cur-dot{opacity:1}
.boxwrap.cur-hot .cur-ring{width:60px; height:60px; margin:-30px 0 0 -30px; border-color:var(--lift)}
.box-fb{position:absolute; inset:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:10px; padding:56px 16px 40px; overflow:auto}
.box-fb button{border:1px solid var(--line); background:var(--paper); border-radius:16px; padding:12px; text-align:left; cursor:pointer}
.tplmenu{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.tpl-pill{
  display:inline-flex; align-items:center; gap:8px; height:40px; padding:0 14px 0 8px; border-radius:999px; border:0; cursor:pointer; color:var(--ink);
  transition:scale .3s var(--spring); -webkit-tap-highlight-color:transparent;
}
.tpl-pill:active{scale:1.08}
.tpl-pill i{width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font:800 12px var(--f-num); font-style:normal; color:var(--on-acc); background:var(--c)}
.tpl-pill .gl{font-weight:700; font-size:13.5px}
.gen{animation:none}
.gen-run .gen{animation:bf .6s var(--ease) both; animation-delay:calc(1.25s + var(--d,0) * 90ms)}

/* PR strip */
.prs{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px}
@media (max-width:540px){ .prs{grid-template-columns:repeat(2,minmax(0,1fr))} }
.prs .p{padding:12px; border-radius:16px; background:var(--paper-2); min-width:0}
.prs .p b{display:block; font:700 26px/1.1 var(--f-num); font-variant-numeric:tabular-nums}
.prs .p > span{font-size:12px; color:var(--ink-2)}

/* ---------- session editor ---------- */
.sess{display:flex; flex-direction:column; gap:14px}
.sess-top{display:flex; flex-direction:column; gap:12px}
.sess-title{width:100%; border:0; background:none; padding:0; font-weight:900; font-size:clamp(24px,6vw,32px); line-height:1.2; color:var(--ink); min-width:0}
.sess-title:focus{outline:none; box-shadow:0 2px 0 var(--lift)}
.sess-stats{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}
.sess-stats div{padding:10px 12px; border-radius:16px; background:var(--paper-2); min-width:0}
.sess-stats b{display:block; font:700 24px/1.1 var(--f-num); font-variant-numeric:tabular-nums}
.sess-stats > div > span{font-size:11.5px; color:var(--ink-2)}
.xcard header{display:flex; align-items:flex-start; gap:10px}
.xcard header > div{flex:1; min-width:0}
.xname{font-weight:800; font-size:17px; line-height:1.3}
.xprev{font-size:12px; color:var(--ink-3); margin-top:2px; overflow-wrap:anywhere}
.xgrp{font:600 10px var(--f-en); letter-spacing:.14em; color:var(--lift-2); text-transform:uppercase}
.sets{display:grid; gap:7px; margin-top:12px}
.set-row,.set-head{display:grid; grid-template-columns:36px minmax(0,1fr) minmax(0,1fr) minmax(0,.75fr) 46px; gap:8px; align-items:center}
.set-head{font:600 10px/1.2 var(--f-en); letter-spacing:.1em; color:var(--ink-3); text-transform:uppercase; text-align:center}
.set-head span:first-child{text-align:left}
.set-row input{
  width:100%; min-width:0; height:44px; border-radius:13px; border:1px solid var(--line); background:var(--paper-2); color:var(--ink);
  font:700 19px/1 var(--f-num); font-variant-numeric:tabular-nums; text-align:center; padding:0 4px; -moz-appearance:textfield; appearance:textfield;
}
.set-row input::placeholder{color:var(--ink-3); opacity:.75}
.set-row input:focus{outline:none; border-color:var(--lift); background:var(--paper)}
.sn{width:36px; height:36px; border-radius:11px; border:0; display:grid; place-items:center; font:700 15px var(--f-num); color:var(--ink-2); background:var(--paper-2); cursor:pointer}
.sn.warm{color:var(--warn); background:var(--warn-soft)}
.chk{width:46px; height:44px; border-radius:13px; border:1px solid var(--line); background:var(--paper); color:var(--ink-3); display:grid; place-items:center; cursor:pointer; transition:scale .3s var(--spring), background .2s}
.chk svg{width:20px; height:20px}
.chk:active{scale:1.12}
.set-row.done .chk{background:var(--lift); color:var(--on-acc); border-color:transparent}
.set-row.done input{background:var(--lift-soft); border-color:transparent}
.xfoot{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px; flex-wrap:wrap}
.xmenu{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; padding:10px; border-radius:14px; background:var(--paper-2)}
.xmenu .btn{min-height:36px; padding:0 12px; font-size:13px}
.ta{width:100%; min-height:84px; border-radius:14px; border:1px solid var(--line); background:var(--paper-2); padding:10px 12px; resize:vertical; line-height:1.5}
.ta:focus{outline:none; border-color:var(--lift)}

/* rest timer */
#rest{
  position:fixed; z-index:58; left:50%; translate:-50% 0; bottom:calc(96px + env(safe-area-inset-bottom,0px));
  display:flex; align-items:center; gap:10px; padding:8px 8px 8px 10px; border-radius:999px; max-width:calc(100% - 32px);
  transition:bottom .4s var(--spring);
}
#rest svg.rg{width:38px; height:38px; flex:none; rotate:-90deg}
#rest .rt{display:flex; flex-direction:column; line-height:1.1; min-width:62px}
#rest .rt b{font:700 22px/1 var(--f-num); font-variant-numeric:tabular-nums}
#rest .rt span{font-size:10.5px; color:var(--ink-2)}
#rest .rb{height:34px; min-width:44px; border-radius:999px; border:0; background:var(--pill); font:700 13px var(--f-num); cursor:pointer; color:var(--ink)}
#rest.done{animation:pulse 1s var(--ease) 3}
@keyframes pulse{50%{scale:1.06}}

/* ---------- forms ---------- */
.field{display:flex; flex-direction:column; gap:6px; min-width:0}
.field > label, .flabel{font-size:12.5px; font-weight:700; color:var(--ink-2)}
.inp{
  width:100%; min-width:0; height:46px; border-radius:14px; border:1px solid var(--line); background:var(--paper-2); padding:0 12px; color:var(--ink);
}
.inp:focus{outline:none; border-color:var(--lift); background:var(--paper)}
.inp.big{height:64px; font:700 34px/1 var(--f-num); font-variant-numeric:tabular-nums; text-align:center}
.timeboxes{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px}
.timeboxes .inp{height:64px; font:700 28px/1 var(--f-num); text-align:center; padding:0 2px}
.timeboxes small{display:block; text-align:center; font-size:11px; color:var(--ink-3); margin-top:4px}
.pace{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; padding:14px 16px; border-radius:18px; background:var(--run-soft); color:var(--run-2)}
.pace b{font:800 40px/1 var(--f-num); font-variant-numeric:tabular-nums}
.pace span{font-size:12.5px; font-weight:700}
.formgrid{display:grid; gap:14px}

/* charts */
.chart{width:100%; height:auto; display:block; overflow:visible}
.chart .ax{fill:var(--ink-3); font:600 10px var(--f-en); letter-spacing:.04em}
.chart .gridl{stroke:var(--line); stroke-width:1}
.chart .goal{stroke:var(--ink-3); stroke-dasharray:4 4; stroke-width:1.2}
.chart .vlab{fill:var(--ink); font:700 11px var(--f-num)}
.chartbox{overflow-x:auto}

/* calendar */
.cal{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:5px}
.cal .ch{text-align:center; font-size:11px; color:var(--ink-3); padding:4px 0}
.cal button{
  aspect-ratio:1; max-width:100%; border:0; border-radius:14px; background:var(--paper-2); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; cursor:pointer; min-width:0; padding:0;
}
.cal button b{font:700 16px/1 var(--f-num)}
.cal button.out{background:none; color:var(--ink-3); opacity:.45}
.cal button.today b{color:var(--lift-2)}
.cal button.sel{background:var(--ink); color:var(--paper)}
.cal button.sel b{color:var(--paper)}
.cal .dots{display:flex; gap:3px; height:6px}
.cal .dot{width:6px; height:6px}

/* heatmap + bars */
.heat{width:100%; height:auto; display:block}
.hbar{display:grid; grid-template-columns:52px minmax(0,1fr) 40px; gap:10px; align-items:center; font-size:13px}
.hbar .tr{height:10px; border-radius:6px; background:var(--paper-2); overflow:hidden}
.hbar .tr i{display:block; height:100%; border-radius:6px; background:var(--lift)}
.hbar .n{text-align:right; font:700 14px var(--f-num)}
.tbl{width:100%; border-collapse:collapse; font-size:13.5px}
.tbl th{font:600 10px var(--f-en); letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); text-align:left; padding:6px 8px; border-bottom:1px solid var(--line)}
.tbl td{padding:9px 8px; border-bottom:1px solid var(--line)}
.tbl td.n{font:700 16px var(--f-num); font-variant-numeric:tabular-nums; white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tblwrap{overflow-x:auto}

/* ---------- sheets ---------- */
.sheet-wrap{
  position:fixed; inset:0; z-index:90; display:grid; place-items:end center;
  padding:max(12px, env(safe-area-inset-top,0px)) max(12px, env(safe-area-inset-right,0px)) max(12px, env(safe-area-inset-bottom,0px)) max(12px, env(safe-area-inset-left,0px));
}
@media (min-width:640px){ .sheet-wrap{place-items:center} }
.scrim{position:absolute; inset:0; background:var(--scrim); -webkit-backdrop-filter:blur(12px) saturate(140%); backdrop-filter:blur(12px) saturate(140%)}
.sheet{
  position:relative; width:min(560px, 100%); max-height:min(88vh, 880px); display:flex; flex-direction:column; min-height:0;
  background:var(--paper); border:1px solid var(--line); border-radius:28px; box-shadow:0 34px 90px -30px rgba(10,12,30,.55); overflow:hidden; transform-origin:0 0;
}
.sheet-body{overflow:auto; padding:22px 20px 24px; overscroll-behavior:contain; display:flex; flex-direction:column; gap:16px; min-height:0}
.sheet-x{position:absolute; top:12px; right:12px; z-index:3}
.sheet .stitle{font-weight:900; font-size:24px; line-height:1.2; margin:0; padding-right:48px; text-wrap:balance}
.kv{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}
.kv div{padding:10px 12px; border-radius:16px; background:var(--paper-2); min-width:0}
.kv b{display:block; font:700 22px/1.15 var(--f-num); font-variant-numeric:tabular-nums}
.kv > div > span{font-size:11.5px; color:var(--ink-2)}
.dlist{display:flex; flex-direction:column; gap:12px}
.dx{padding:12px 14px; border-radius:16px; background:var(--paper-2)}
.dx h4{margin:0 0 6px; font-size:15px; font-weight:800}
.dsets{display:flex; flex-wrap:wrap; gap:6px}
.dsets span{padding:3px 9px; border-radius:999px; background:var(--paper); font:700 14px var(--f-num); font-variant-numeric:tabular-nums}
.dsets span.w{color:var(--warn)}
.picker-list{display:flex; flex-direction:column; gap:6px}
.picker-list button{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; border-radius:14px; border:1px solid var(--line); background:var(--paper); cursor:pointer; text-align:left}
.picker-list button small{color:var(--ink-3)}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{height:32px; padding:0 12px; border-radius:999px; border:1px solid var(--line); background:var(--paper-2); cursor:pointer; font-size:13px; font-weight:700; color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:transparent}
.tplx{display:flex; flex-direction:column; gap:8px}
.tplx .it{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:14px; background:var(--paper-2)}
.tplx .it span{flex:1; min-width:0; font-weight:700}
.tplx .it small{color:var(--ink-3); font-size:12px}
.iconx{width:32px; height:32px; border-radius:50%; border:0; background:var(--paper); display:grid; place-items:center; cursor:pointer; color:var(--ink-3)}
.iconx svg{width:16px; height:16px}
.tpl-hero{display:flex; align-items:center; gap:14px}
.tpl-hero .badge{width:56px; height:56px; border-radius:18px; display:grid; place-items:center; font:800 24px var(--f-num); color:var(--on-acc); background:var(--c); flex:none}

/* toast */
#toast{position:fixed; z-index:95; left:50%; translate:-50% 0; top:calc(72px + env(safe-area-inset-top,0px)); padding:10px 16px; border-radius:999px; font-size:13.5px; font-weight:700; pointer-events:none; opacity:0; transition:opacity .3s, translate .4s var(--spring); max-width:calc(100% - 32px); text-align:center}
#toast.on{opacity:1; translate:-50% 6px}

/* ---------- lens ---------- */
#lens{position:fixed; left:0; top:0; z-index:70; width:var(--ls,150px); height:var(--ls,150px); border-radius:50%; touch-action:none; cursor:grab; -webkit-tap-highlight-color:transparent}
#lens.grab{cursor:grabbing}
.lens-view{position:absolute; inset:0; border-radius:50%; overflow:hidden; background:var(--bg); filter:url(#lensRefract)}
.lens-scale{position:absolute; inset:0; transform:scale(1.5); transform-origin:50% 50%}
.lens-clone{position:absolute; left:0; top:0; pointer-events:none}
.lens-rim{
  position:absolute; inset:0; border-radius:50%; pointer-events:none;
  box-shadow:
    inset 0 0 0 1px var(--glass-hi),
    inset 0 2px 2px var(--glass-hi),
    inset 0 -4px 8px var(--glass-inset),
    inset 0 0 26px var(--glass-lo),
    0 20px 44px -14px var(--glass-shade),
    0 2px 8px var(--glass-inset);
}
.lens-rim::after{content:""; position:absolute; inset:5%; border-radius:50%; background:radial-gradient(56% 26% at 38% 10%, var(--glass-hi), transparent 72%); opacity:.85}
.lens-x{position:absolute; right:-4px; top:-4px; width:30px; height:30px; border-radius:50%; border:0; display:grid; place-items:center; cursor:pointer; color:var(--ink)}
.lens-x svg{width:14px; height:14px}

.sr{position:absolute !important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

@media (prefers-reduced-motion: reduce){
  .bf, .gen-run .gen{animation:none}
  .gseg-pill, .gseg-clone, #tabbar{transition-duration:.01ms}
  #rest.done{animation:none}
}

/* ================= Apple Fitness layer ================= */
body::before{display:none}
.main{max-width:720px}
.view{gap:18px}
.eyebrow{font:600 13px/1.3 var(--f-ui); letter-spacing:0; text-transform:none; color:var(--ink-3)}
.title{font:800 34px/1.15 var(--f-ui); letter-spacing:-.01em; margin:0}
.sec{font:700 21px/1.25 var(--f-ui); letter-spacing:-.005em}
.head{padding:14px 2px 0}
.card{border:0; box-shadow:none; border-radius:22px; padding:18px}
.card-h{margin-bottom:14px}
.link{color:var(--lift-2); font-weight:600; font-size:15px}
.small{font-size:13px}
.unit{font:600 13px var(--f-num); letter-spacing:0; color:var(--ink-3)}
.spot::before{display:none}
.bf{animation-duration:.4s}

.banner{background:var(--yellow-soft); border-radius:16px; padding:10px 14px; font-size:14px}
.banner .link{color:var(--yellow-ink)}

.btn-run{background:var(--run); color:var(--on-run)}
/* rings summary */
.ringcard{display:flex; align-items:center; gap:22px}
.ringbox{width:156px; max-width:44%; flex:none}
.rings{width:100%; height:auto; display:block}
.rstats{display:flex; flex-direction:column; gap:12px; flex:1; min-width:0}
.rstats > div{display:flex; flex-direction:column}
.rl{font:600 14px/1.3 var(--f-ui); color:var(--ink-2)}
.rl::before{content:""; display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--c); margin-right:6px; vertical-align:1px}
.rv{font:700 26px/1.15 var(--f-num); font-variant-numeric:tabular-nums; white-space:nowrap}
.rv small{font:700 15px var(--f-num); opacity:.7; margin-left:3px}
@media (max-width:380px){ .ringcard{gap:16px} .rv{font-size:22px} .rv small{font-size:13px} }

/* start tiles */
.starts{gap:12px}
.start{flex-direction:row; align-items:center; gap:12px; min-height:0; padding:14px; border-radius:22px; background:var(--paper)}
.start-lift, .start-run{background:var(--paper)}
.start .s-ico{width:44px; height:44px; flex:none; background:var(--acc-soft); color:var(--acc)}
.start-lift{--acc-soft:var(--lift-soft)}
.start-run{--acc-soft:var(--run-soft)}
.s-t{display:flex; flex-direction:column; min-width:0; line-height:1.3}
.s-t b{font:700 16px var(--f-ui)}
.s-t span{font-size:12.5px; color:var(--ink-2)}
.start:active{scale:.97}

/* daily bars */
.dbars{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:10px; align-items:end}
.db{display:flex; flex-direction:column; align-items:center; gap:7px; min-width:0}
.dbt{width:100%; max-width:24px; height:96px; border-radius:8px; background:var(--paper-2); display:flex; flex-direction:column-reverse; overflow:hidden}
.dbt i{display:block; width:100%; flex:none}
.dbt i.l{background:var(--lift)}
.dbt i.r{background:var(--run)}
.db span{font:600 12px var(--f-ui); color:var(--ink-3)}
.db.today span{color:var(--ink)}
.db.fut .dbt{opacity:.45}
.legend{display:flex; gap:14px; flex-wrap:wrap; margin-top:12px; font-size:13px; color:var(--ink-2)}
.legend i{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; vertical-align:0}

/* grouped lists */
.list{background:var(--paper); border-radius:22px; overflow:hidden; gap:0}
.entry{border:0; border-radius:0; box-shadow:none; background:none; padding:12px 16px; grid-template-columns:40px minmax(0,1fr) auto}
.entry + .entry{box-shadow:inset 68px 1px 0 -67px var(--paper), inset 0 1px 0 var(--line)}
.entry:active{scale:1; background:var(--paper-2)}
.entry .e-ico{width:40px; height:40px; border-radius:50%}
.entry .e-ico svg{width:19px; height:19px}
.entry .e-t{font:600 16px/1.3 var(--f-ui)}
.entry .e-v{font:700 20px/1 var(--f-num)}
.entry .e-v small{font:600 12px/1.6 var(--f-ui); letter-spacing:0; text-transform:none}
.empty{border:0; background:var(--paper); border-radius:22px}
.list > .empty{border-radius:0}

/* tiles + misc */
.tile .tv{font:700 32px/1.1 var(--f-num)}
.tile .tl{font-weight:600; color:var(--ink-2)}
.meter{height:8px; border-radius:8px}
.meter i{background:var(--run)}
.btn{font-weight:600}
.btn-lift{background:var(--lift-2); color:var(--on-acc); box-shadow:none}
.btn-run{background:var(--run-2); color:var(--on-acc); box-shadow:none}
.btn-soft{background:var(--paper-2); border:0}
.btn-danger{background:var(--bad-soft)}
.prs .p, .sess-stats div, .kv div{border-radius:16px}
.prs .p b, .sess-stats b, .kv b{font-family:var(--f-num)}
.xgrp{font:600 12px var(--f-ui); letter-spacing:0; text-transform:none; color:var(--ink-3)}
.xname{font:700 18px/1.3 var(--f-ui)}
.set-head{font:600 11px var(--f-ui); letter-spacing:0; text-transform:none}
.set-row input{border:0; font-family:var(--f-num)}
.chk{border:0; background:var(--paper-2)}
.sn{font-family:var(--f-num)}
.sess-title{font:800 28px/1.2 var(--f-ui)}
.pace{border-radius:16px}
.pace b{font-family:var(--f-num)}
.inp{border:0}
.inp:focus{box-shadow:0 0 0 2px var(--lift)}
.ta{border:0}
.chart .ax{font:500 11px var(--f-ui); letter-spacing:0}
.chart .vlab{font:700 12px var(--f-num)}
.tbl th{font:600 12px var(--f-ui); letter-spacing:0; text-transform:none}
.tbl td.n{font-family:var(--f-num)}
.boxwrap{border:0; box-shadow:none; border-radius:22px}
.box-hint{font-size:13px}
.tpl-pill i{font-family:var(--f-num)}
.cal{gap:4px 2px}
.cal .ch{font-weight:600}
.cal button{background:none; border-radius:50%; width:100%; max-width:46px; margin:0 auto}
.cal button b{font:600 17px/1 var(--f-num)}
.cal button.out{opacity:.35}
.cal button.today b{color:var(--run-2)}
.cal button.sel{background:var(--ink)}
.sheet{border:0}
.sheet .stitle{font:800 26px/1.2 var(--f-ui)}
.dx{border-radius:16px}
.tag{font-weight:600}
#toast{font-weight:600}
/* ================= iOS ================= */
html{-webkit-tap-highlight-color:transparent; scroll-padding-top:calc(84px + env(safe-area-inset-top,0px)); scroll-padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
button, a, label, [data-act]{touch-action:manipulation; -webkit-touch-callout:none}
.gseg, .tpl-pill, .start, .chk, .sn, .cal button, #tabbar{-webkit-user-select:none; user-select:none}
/* 16px+ so iOS Safari never zooms on focus */
.inp, .ta, select.inp, .set-row input, input[type="date"]{font-size:16px}
.inp.big{font-size:34px}
.timeboxes .inp{font-size:28px}
.set-row input{font-size:19px}
input[type="date"].inp{-webkit-appearance:none; appearance:none; display:flex; align-items:center; min-height:46px; line-height:46px}
input[type="date"]::-webkit-date-and-time-value{text-align:left}

/* ================= 3D muscle body (lift) =================
   The stage is content (opaque paper); glass is only on the controls and callouts floating over it. */
:root{ --muscle:#B0443F; --muscle-soft:#F4DEDB; --tendon:#F3EBDD }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --muscle:#E2827A; --muscle-soft:#3A2224; --tendon:#3B362F } }
:root[data-theme="dark"]{ --muscle:#E2827A; --muscle-soft:#3A2224; --tendon:#3B362F }

.bs-lines circle.on{fill:var(--lift-2); stroke:var(--paper)}

  pointer-events:auto; position:absolute; left:0; top:0; height:30px; display:inline-flex; align-items:center; gap:6px; padding:0 11px; border-radius:999px; border:0; cursor:pointer;
  font:600 12.5px/1 var(--f-ui); color:var(--ink); white-space:nowrap; background:var(--glass);
  -webkit-backdrop-filter:blur(16px) saturate(180%); backdrop-filter:blur(16px) saturate(180%);

  transition:background .25s, color .25s, scale .35s var(--spring); will-change:transform; -webkit-tap-highlight-color:transparent;
}

.bs-lab:active{scale:1.08}
/* Anatomical region key: opaque badges + matching pins stay legible over 2K textures. */
.bs-lab.bs-region{background:var(--paper);box-shadow:0 4px 16px rgba(27,18,21,.16),inset 0 0 0 1.5px var(--zone-hue);font-weight:750}
.bs-lab.bs-region::before{content:"";display:block;flex:none;width:9px;height:9px;border-radius:50%;background:var(--zone-hue);box-shadow:0 0 0 2px var(--paper)}
.bs-lab.bs-region[aria-pressed="true"]{background:var(--ink);color:var(--paper);box-shadow:0 5px 18px rgba(27,18,21,.25),inset 0 0 0 2px var(--zone-hue)}
.bs-lines path.bs-region-line{stroke:var(--zone-hue);stroke-width:1.7;filter:drop-shadow(0 0 1px rgba(255,255,255,.8))}
.bs-lines circle.bs-region-dot{fill:var(--zone-hue);stroke:var(--paper);stroke-width:2.5;filter:drop-shadow(0 1px 2px rgba(18,17,19,.45))}
.bs-lines circle.bs-region-dot.on{fill:var(--zone-hue);stroke:var(--ink);stroke-width:2.5}
.bs-top{position:absolute; left:10px; right:10px; top:10px; z-index:4; display:flex; align-items:center; gap:8px; pointer-events:none}
.bs-top > *{pointer-events:auto}
.bs-face{width:132px}
.bs-face .gseg-item{padding:7px 8px}
.bs-back{height:38px; padding:0 14px 0 9px; border-radius:999px; border:0; display:inline-flex; align-items:center; gap:3px; cursor:pointer; font:600 14px var(--f-ui); color:var(--ink); transition:scale .3s var(--spring); -webkit-tap-highlight-color:transparent}
.bs-back svg{width:18px; height:18px}
.bs-back:active{scale:1.06}
.bstage.bs-group .bs-face{display:none}
.bstage:not(.bs-group) .bs-back{display:none}
.bs-tip{position:absolute; z-index:5; left:0; top:0; padding:7px 11px; border-radius:14px; font:600 12.5px/1.35 var(--f-ui); pointer-events:none; white-space:nowrap; transition:opacity .15s}
.bs-tip small{display:block; font-weight:500; color:var(--ink-2); font-size:11.5px}
.bs-hint{position:absolute; left:50%; bottom:12px; translate:-50% 0; z-index:2; max-width:calc(100% - 32px); padding:6px 13px; border-radius:999px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:12px; letter-spacing:.02em; color:var(--ink-2); pointer-events:none; transition:opacity .5s;
  background:color-mix(in srgb, var(--paper) 62%, transparent); -webkit-backdrop-filter:blur(10px) saturate(160%); backdrop-filter:blur(10px) saturate(160%); box-shadow:inset 0 1px 0 var(--glass-hi, rgba(255,255,255,.6)), inset 0 0 0 1px var(--glass-lo, rgba(0,0,0,.04))}
.bstage.bs-touched .bs-hint, .bstage.bs-zone-on .bs-hint{opacity:0}
.bs-legend{position:absolute; left:16px; top:60px; z-index:2; display:flex; flex-direction:column; gap:4px; font-size:11.5px; color:var(--ink-3); pointer-events:none; transition:opacity .3s}
.bs-legend i{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align:0}
.bstage.bs-group .bs-legend{opacity:0}
.bs-zone{position:absolute; left:50%; bottom:12px; z-index:4; translate:-50% 0; height:40px; padding:0 8px 0 16px; border-radius:999px; border:0; display:inline-flex; align-items:center; gap:10px; cursor:pointer; color:var(--ink); font:600 14px var(--f-ui); white-space:nowrap; transition:opacity .3s, translate .45s var(--spring)}
.bs-zone span{width:26px; height:26px; border-radius:50%; display:grid; place-items:center; background:var(--lift-2); color:var(--on-acc)}
.bs-zone span svg{width:15px; height:15px; rotate:90deg}
.bs-zone[hidden]{display:inline-flex !important; opacity:0; translate:-50% 16px; pointer-events:none}
.bs-load{position:absolute; inset:0; z-index:6; display:grid; place-items:center; align-content:center; gap:10px; background:var(--paper); color:var(--ink-3); font-size:13px; transition:opacity .4s}
.bs-load[hidden]{display:grid !important; opacity:0; pointer-events:none}
.bs-load .wx-dot{width:20px; height:20px}

/* part grid (overview) */
.parts{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}
@media (max-width:440px){ .parts{grid-template-columns:repeat(2,minmax(0,1fr))} }
.part{position:relative; display:flex; flex-direction:column; align-items:flex-start; gap:1px; padding:14px 14px 20px; border:0; border-radius:18px; background:var(--paper); color:var(--ink); text-align:left; cursor:pointer; min-width:0; overflow:hidden; transition:scale .3s var(--spring), box-shadow .25s; -webkit-tap-highlight-color:transparent}
.part:active{scale:.97}
@media (hover:hover){ .part:hover{box-shadow:inset 0 0 0 1.5px var(--muscle)} }
.part b{font:700 17px/1.3 var(--f-ui)}
.part .en{font:600 9.5px/1.4 var(--f-en); letter-spacing:.16em; color:var(--ink-3)}
.part .st{font-size:12px; color:var(--ink-2); margin-top:8px; font-variant-numeric:tabular-nums}
.part .bar{position:absolute; left:14px; right:14px; bottom:11px; height:3px; border-radius:3px; background:var(--paper-2); overflow:hidden}
.part .bar i{display:block; height:100%; border-radius:3px; background:var(--muscle); width:calc(var(--p, 0) * 100%); transition:width .6s var(--ease)}

/* zone chips + info (part view) */
.zchips{display:flex; gap:8px; overflow-x:auto; margin:0 -16px; padding:2px 16px 4px; scrollbar-width:none; -webkit-overflow-scrolling:touch}
.zchips::-webkit-scrollbar{display:none}
.zchip{flex:none; height:38px; padding:0 14px; border-radius:999px; border:0; background:var(--paper); color:var(--ink-2); cursor:pointer; display:inline-flex; align-items:center; gap:6px; font:600 14px var(--f-ui); transition:background .2s, color .2s, scale .3s var(--spring); -webkit-tap-highlight-color:transparent}
.zchip:active{scale:.96}
.zchip small{font:600 11px var(--f-num); opacity:.6}
.zchip i{width:6px; height:6px; border-radius:50%; background:var(--muscle)}
.zchip.region-chip::before{content:"";display:block;flex:none;width:9px;height:9px;border-radius:50%;background:var(--zone-hue)}
.zchip.region-chip[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--zone-hue)}
.zchip[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
.zinfo{display:flex; flex-direction:column; gap:10px}
.zinfo-h{display:flex; align-items:flex-start; gap:14px}
.zinfo-h > div:first-child{flex:1; min-width:0}
.zinfo-h .sec{font-size:22px; margin-top:2px}
.zinfo-k{display:flex; flex-direction:column; align-items:flex-end; text-align:right; min-width:0}
.zinfo-k b{font:700 22px/1.1 var(--f-num); font-variant-numeric:tabular-nums; white-space:nowrap}
.zinfo-k span{font-size:11.5px; color:var(--ink-3); white-space:nowrap}
.zinfo p{margin:0}

/* exercise choices */
.exl{display:flex; flex-direction:column; gap:8px}
.exl-h{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:10px 4px 0; font:600 13px var(--f-ui); color:var(--ink-3)}
.exl-h:first-child{margin-top:0}
.exo{position:relative; display:grid; grid-template-columns:28px minmax(0,1fr) auto; gap:12px; align-items:start; padding:14px 16px; background:var(--paper); border-radius:18px; cursor:pointer; transition:background .2s, box-shadow .2s; -webkit-tap-highlight-color:transparent}
.exo input{-webkit-appearance:none; appearance:none; width:26px; height:26px; margin:1px 0 0; border-radius:50%; border:1.5px solid var(--line); background:var(--paper-2); display:grid; place-items:center; cursor:pointer; transition:background .2s, border-color .2s, scale .3s var(--spring)}
.exo input::after{content:""; width:10px; height:5px; border:2.2px solid var(--on-acc); border-top:0; border-right:0; transform:translateY(-1px) rotate(-45deg); opacity:0; transition:opacity .15s}
.exo input:checked{background:var(--lift-2); border-color:var(--lift-2)}
.exo input:checked::after{opacity:1}
.exo input:active{scale:1.12}
.exo:has(input:checked){background:var(--lift-soft); box-shadow:inset 0 0 0 1.5px var(--lift-2)}
.exo-main{min-width:0}
.exo-main b{display:block; font:600 16px/1.35 var(--f-ui)}
.exo-main small{display:block; color:var(--ink-2); font-size:12.5px; margin-top:3px; overflow-wrap:anywhere}
.exo-main em{display:block; font-style:normal; color:var(--ink-3); font-size:12.5px; line-height:1.45; margin-top:5px}
.exo-tags{display:flex; flex-wrap:wrap; gap:4px; justify-content:flex-end; max-width:96px}
.exo-tags i{font-style:normal; font-size:11px; font-weight:600; line-height:1.6; padding:0 7px; border-radius:999px; background:var(--paper-2); color:var(--ink-2); white-space:nowrap}
.exo-tags i.p{background:var(--muscle-soft); color:var(--muscle)}

/* selection tray — a floating control, so glass */
#liftTray{position:fixed; z-index:59; left:50%; translate:-50% 0; bottom:calc(90px + env(safe-area-inset-bottom,0px)); width:min(460px, calc(100% - 2 * max(16px, env(safe-area-inset-left,0px)))); display:flex; align-items:center; gap:8px; padding:8px 8px 8px 16px; border-radius:24px; transition:transform .3s var(--ease), opacity .25s}
.tray-t{flex:1; min-width:0; display:flex; flex-direction:column; line-height:1.3}
.tray-t b{font:700 15px var(--f-ui)}
.tray-t span{font-size:12px; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
#liftTray .btn{min-height:44px; padding:0 16px; flex:none}
#liftTray .iconx{background:var(--pill); flex:none}
html.tray-on .main{padding-bottom:calc(210px + env(safe-area-inset-bottom,0px))}
html.kb #liftTray{transform:translateY(220%); opacity:0; pointer-events:none}

/* today: jump straight into a part */
.tparts{display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:6px}
@media (max-width:440px){ .tparts{grid-template-columns:repeat(3,minmax(0,1fr))} }
.tpart{display:flex; flex-direction:column; align-items:center; gap:3px; padding:10px 4px 9px; border:0; border-radius:14px; background:var(--paper-2); color:var(--ink); cursor:pointer; min-width:0; transition:scale .3s var(--spring); -webkit-tap-highlight-color:transparent}
.tpart:active{scale:.95}
.tpart b{font:700 15px/1.2 var(--f-ui)}
.tpart small{font:600 11.5px var(--f-num); color:var(--ink-3); font-variant-numeric:tabular-nums}
.tpart.on{background:var(--muscle-soft)}
.tpart.on small{color:var(--muscle)}
@media (prefers-reduced-motion: reduce){ .bs-lab, .bs-zone, .part, .zchip, .tpart{transition:none} }

/* exercise demonstrations */
.exo-row{position:relative}
.exo-row .exo{padding-bottom:48px}
.exo-demo{position:absolute; left:56px; bottom:12px; height:30px; padding:0 12px 0 9px; border:0; border-radius:999px; display:inline-flex; align-items:center; gap:5px; background:var(--paper-2); color:var(--ink); font:600 12.5px var(--f-ui); cursor:pointer; transition:background .2s, scale .3s var(--spring)}
.exo-demo svg{width:14px; height:14px}
.exo-demo:hover{background:var(--line)} .exo-demo:active{scale:.94}
.xcard header .xdemo{flex:none}
.demo-head{margin:2px 0 12px}
.demo-host{position:relative; flex:none; height:min(54vh, 460px); height:min(54svh, 460px); border-radius:22px; overflow:hidden; background:var(--paper-2); margin-bottom:14px}
.demo-host.demo-nogl{height:auto; padding:16px; background:var(--paper-2)}
.demo-host .bstage{height:100%; border-radius:22px; margin:0}
.bstage.bs-demo .bs-top, .bstage.bs-demo .bs-legend, .bstage.bs-demo .bs-hint, .bstage.bs-demo .bs-zone, .bstage.bs-demo .bs-labels, .bstage.bs-demo .bs-lines, .bstage.bs-demo .bs-tip{display:none}
.demo-play{position:absolute; right:12px; bottom:12px; z-index:6}
.demo-zones{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 10px}
.dz{display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 11px; border-radius:999px; background:var(--paper-2); font:600 13px var(--f-ui); color:var(--ink-2)}
.dz i{width:8px; height:8px; border-radius:50%; background:var(--muscle); opacity:.4}
.dz.p{background:var(--muscle-soft); color:var(--muscle)} .dz.p i{opacity:1}
.demo-tip{font:600 15px/1.5 var(--f-ui); margin:4px 0 6px; color:var(--ink)}
.demo-note{margin:0 0 14px}
</style>

function normalize(st) {
  const f = freshState();
  if (!st || typeof st !== 'object') return f;
  const o = { ...f, ...st };
  o.profile = { ...f.profile, ...(st.profile || {}) };
  o.exercises = Array.isArray(st.exercises) && st.exercises.length ? st.exercises : f.exercises;
  // make sure built-in exercises exist
  for (const e of f.exercises) if (!o.exercises.some(x => x.id === e.id)) o.exercises.push(e);
  o.templates = Array.isArray(st.templates) && st.templates.length ? st.templates.slice(0, 5) : f.templates;
  while (o.templates.length < 5) o.templates.push(f.templates[o.templates.length]);
  // Earlier versions automatically created demo workouts. They are not real user data.
  // Preserve every genuine local record, but never show demo sessions as progress.
  o.lifts = Array.isArray(st.lifts) ? st.lifts.filter(l => l && l.ex !== true && l.date && Array.isArray(l.items)) : [];
  o.runs = Array.isArray(st.runs) ? st.runs.filter(r => r && r.ex !== true && r.date) : [];
  o.active = st.active && Array.isArray(st.active.items) ? st.active : null;
  return o;
}

})();

    const to = parseFloat(el.dataset.tick), dec = +(el.dataset.dec || 0);

function scoredRecords(records, end) {

  const runs = R.filter(r => !isWalk(r)), walks = R.filter(isWalk);

    { name: '健走累積', pts: sum(walks, runPoints), detail: `${walks.length} 次・${fmtN(sum(walks, r => positive(r.km)), 1)} km` },

  const xx = lowerBetter ? -x : x;

  if (xx >= pts[pts.length - 1][0]) return { p: 99, above: true };
  for (let i = 1; i < pts.length; i++) if (xx <= pts[i][0]) { const [x0, p0] = pts[i - 1], [x1, p1] = pts[i]; return { p: Math.round(p0 + (p1 - p0) * (xx - x0) / (x1 - x0)) }; }

  const url = back <= 6

function niceMax(v) {

function barChart({ vals, labels, color, goal = 0, fmt = v => fmtN(v), unit = '', w = chartW(), h = 200, title = '' }) {
  const pl = 40, pr = 10, pt = 22, pb = 26;
  const max = niceMax(Math.max(...vals, goal, 1) * 1.08);
  const n = vals.length, iw = w - pl - pr, ih = h - pt - pb, bw = iw / n;
  const y = v => pt + ih - (v / max) * ih;
  let s = `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(title)}">`;
  for (const t of [0, max / 2, max]) s += `<line class="gridl" x1="${pl}" x2="${w - pr}" y1="${y(t)}" y2="${y(t)}"/><text class="ax" x="${pl - 8}" y="${y(t) + 3.5}" text-anchor="end">${fmt(t)}</text>`;
  const maxI = vals.indexOf(Math.max(...vals));
  vals.forEach((v, i) => {
    const x = pl + i * bw + bw * .2, bh = Math.max(v > 0 ? 2 : 0, ih - (y(v) - pt));
    const last = i === n - 1;
    s += `<rect x="${x.toFixed(1)}" y="${(pt + ih - bh).toFixed(1)}" width="${(bw * .6).toFixed(1)}" height="${bh.toFixed(1)}" rx="${Math.min(5, bw * .18).toFixed(1)}" style="fill:${color};opacity:${last ? 1 : .42}"><title>${esc(labels[i])}：${fmt(v)} ${unit}</title></rect>`;
    if ((last || i === maxI) && v > 0) s += `<text class="vlab" x="${(x + bw * .3).toFixed(1)}" y="${(pt + ih - bh - 6).toFixed(1)}" text-anchor="middle">${fmt(v)}</text>`;
  });
  const every = Math.ceil(n / 6);
  labels.forEach((l, i) => { if ((n - 1 - i) % every === 0) s += `<text class="ax" x="${(pl + i * bw + bw / 2).toFixed(1)}" y="${h - 8}" text-anchor="middle">${esc(l)}</text>`; });
  if (goal > 0) s += `<line class="goal" x1="${pl}" x2="${w - pr}" y1="${y(goal)}" y2="${y(goal)}"/><text class="ax" x="${w - pr}" y="${y(goal) - 5}" text-anchor="end">目標 ${fmt(goal)}</text>`;
  return s + '</svg>';
}
function lineChart({ pts, color, w = chartW(), h = 210, fmt = v => fmtN(v, 1), title = '' }) {
  if (pts.length < 2) return `<div class="empty">至少要兩次紀錄才畫得出趨勢</div>`;

  const x0 = Math.min(...xs), x1 = Math.max(...xs);

  const X = v => pl + (x1 === x0 ? .5 : (v - x0) / (x1 - x0)) * (w - pl - pr);
  const Y = v => pt + (1 - (v - y0) / (y1 - y0)) * (h - pt - pb);
  const gid = 'g' + uid();
  let s = `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(title)}"><defs><linearGradient id="${gid}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style="stop-color:${color};stop-opacity:.28"/><stop offset="1" style="stop-color:${color};stop-opacity:0"/></linearGradient></defs>`;
  for (const t of [y0, (y0 + y1) / 2, y1]) s += `<line class="gridl" x1="${pl}" x2="${w - pr}" y1="${Y(t)}" y2="${Y(t)}"/><text class="ax" x="${pl - 8}" y="${Y(t) + 3.5}" text-anchor="end">${fmtN(t)}</text>`;
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.x).toFixed(1)} ${Y(p.y).toFixed(1)}`).join(' ');
  s += `<path d="${line} L${X(x1).toFixed(1)} ${Y(y0)} L${X(x0).toFixed(1)} ${Y(y0)} Z" fill="url(#${gid})"/>`;
  s += `<path d="${line}" fill="none" style="stroke:${color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((p, i) => { const last = i === pts.length - 1; s += `<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${last ? 5 : 2.6}" style="fill:${last ? color : 'var(--paper)'};stroke:${color}" stroke-width="2"><title>${esc(p.label)}：${fmt(p.y)}</title></circle>`; });

  s += `<text class="ax" x="${pl}" y="${h - 8}">${esc(pts[0].label)}</text><text class="ax" x="${w - pr}" y="${h - 8}" text-anchor="end">${esc(lp.label)}</text>`;
  return s + '</svg>';
}

function ringsSVG(rings, size = 156) {
  const sw = 17, gap = 3, c = size / 2;
  let s = `<svg class="rings" viewBox="0 0 ${size} ${size}" aria-hidden="true">`;
  rings.forEach((g, i) => {
    const r = c - sw / 2 - i * (sw + gap), C = 2 * Math.PI * r;
    const p = Math.max(0, g.p || 0), main = Math.min(p, 1), over = Math.min(Math.max(p - 1, 0), 1);
    const arc = (col, k) => `<circle class="ring-arc" cx="${c}" cy="${c}" r="${r.toFixed(2)}" fill="none" style="stroke:${col}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C * (1 - k)).toFixed(2)}" data-c="${C.toFixed(2)}" transform="rotate(-90 ${c} ${c})"/>`;
    s += `<circle cx="${c}" cy="${c}" r="${r.toFixed(2)}" fill="none" style="stroke:${g.track}" stroke-width="${sw}"/>`;
    if (main > 0.001) s += arc(g.color, main);

  });
  return s + '</svg>';
}

function recentReusableLifts(limit = 4) {

    const key = `${(l.title || '').trim().toLowerCase()}|${l.items.map(it => it.eid).join(',')}`;

  if (!items.length) { toast('這筆紀錄沒有可複製的組數'); return; }
  S.lifts.push({ id: uid(), date, start: Date.now(), dur: Math.round(durMin * 60),

function exZones(eid) {
  const m = EX_ZONES[eid]; if (m) return m;
  const g = exById(eid).group;               // custom exercise: spread over its body part
  return { p: [], s: ZONES.filter(z => z.g === g).map(z => z.id) };
}
function muscleLoad(days = 7) {
  const to = todayISO(), from = addDays(to, -(days - 1));
  const zone = Object.fromEntries(ZONES.map(z => [z.id, { sets: 0, last: null }]));
  const group = Object.fromEntries(Object.keys(GROUPS).map(g => [g, { sets: 0, last: null }]));
  for (const l of S.lifts) {
    if (l.ex || !l.date || l.date > to) continue;
    for (const it of l.items || []) {
      const n = workSets(it).length; if (!n) continue;
      const gz = group[exById(it.eid).group];
      if (gz) { if (l.date >= from) gz.sets += n; if (!gz.last || l.date > gz.last) gz.last = l.date; }
      const zm = exZones(it.eid);
      for (const id of zm.p) { const o = zone[id]; if (!o) continue; if (l.date >= from) o.sets += n; if (!o.last || l.date > o.last) o.last = l.date; }
      for (const id of zm.s) { const o = zone[id]; if (o && l.date >= from) o.sets += n / 2; }
    }
  }
  return { zone, group };
}
const fmtSetsN = n => fmtN(n, n % 1 ? 1 : 0);
const lastTxt = d => d ? relDay(d) : '尚未練';
function heatMap(load) {
  return Object.fromEntries(Object.entries(load.zone).filter(([, v]) => v.sets > 0).map(([k, v]) => [k, Math.min(1, Math.sqrt(v.sets / 12))]));
}

/* ---------- STATS ---------- */
function renderStats(anim) {
  const t = todayISO(), ws = weekStart(t);
  const firstDate = entries().map(e => e.d.date).sort()[0] || t;
  const nW = UI.statsRange === '4w' ? 4 : UI.statsRange === '12w' ? 12 : clamp(Math.ceil((dayDiff(weekStart(firstDate), ws) + 7) / 7), 4, 52);
  const weeks = [...Array(nW)].map((_, i) => addDays(ws, (i - nW + 1) * 7));
  const from = weeks[0], st = rangeStats(from, t);
  const wstats = weeks.map(weekStats);
  const vols = wstats.map(s => Math.round(s.vol / 100) / 10);
  const kms = wstats.map(s => Math.round(s.km * 10) / 10);
  const labels = weeks.map(w => `W${isoWeek(w)}`);
  // e1RM trend for the chosen lift
  const mainLifts = ['squat', 'bench', 'deadlift', 'ohp'];
  const pts = S.lifts.filter(l => l.date >= from).sort((a, b) => a.date.localeCompare(b.date)).map(l => {
    const it = l.items.find(i => i.eid === UI.statsLift); if (!it) return null;
    const b = itemBest(it); return b ? { x: dayDiff(from, l.date), y: Math.round(b * 10) / 10, label: fmtShort(l.date) } : null;
  }).filter(Boolean);
  // group distribution
  const groups = Object.keys(GROUPS).map(g => ({ g, n: sum(st.L, l => sum(l.items.filter(it => exById(it.eid).group === g), it => workSets(it).length)) }));
  const gmax = Math.max(1, ...groups.map(g => g.n));
  // heatmap: last 16 weeks
  const HW = 16, hs = addDays(ws, -(HW - 1) * 7), cs = 15, gap = 3;
  let heat = `<svg class="heat" viewBox="0 0 ${22 + HW * (cs + gap)} ${7 * (cs + gap) + 4}" role="img" aria-label="近 16 週每日運動"><defs><linearGradient id="hboth" x1="0" y1="0" x2="1" y2="1"><stop offset=".5" style="stop-color:var(--lift)"/><stop offset=".5" style="stop-color:var(--run)"/></linearGradient></defs>`;
  ['一', '', '三', '', '五', '', '日'].forEach((d, i) => { if (d) heat += `<text class="ax" x="0" y="${i * (cs + gap) + cs - 3}" style="fill:var(--ink-3);font:500 10px var(--f-ui)">${d}</text>`; });
  for (let w = 0; w < HW; w++) for (let d = 0; d < 7; d++) {
    const day = addDays(hs, w * 7 + d); if (day > t) continue;
    const l = S.lifts.some(x => x.date === day), r = S.runs.some(x => x.date === day);
    const fill = l && r ? 'url(#hboth)' : l ? 'var(--lift)' : r ? 'var(--run)' : 'var(--paper-2)';
    heat += `<rect x="${22 + w * (cs + gap)}" y="${d * (cs + gap)}" width="${cs}" height="${cs}" rx="4" style="fill:${fill}${day === t ? ';stroke:var(--ink);stroke-width:1.5' : ''}"><title>${fmtDate(day)}${l ? ' 重訓' : ''}${r ? ' 跑步' : ''}</title></rect>`;
  }

    .sort((a, b) => Object.keys(GROUPS).indexOf(a.e.group) - Object.keys(GROUPS).indexOf(b.e.group) || b.p.e1 - a.p.e1);

    <div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
      <section class="card tile spot"><span class="tl">訓練次數</span><span class="tv">${tick(st.n)}<span class="unit">次</span></span><span class="small faint">重訓 ${st.L.length} · 跑步 ${st.R.length}</span></section>
      <section class="card tile spot"><span class="tl">重訓總量</span><span class="tv">${tick(Math.round(st.vol / 100) / 10, 1)}<span class="unit">噸</span></span><span class="small faint">${st.sets} 組有效組</span></section>
      <section class="card tile spot"><span class="tl">跑量</span><span class="tv">${tick(st.km, 1)}<span class="unit">km</span></span><span class="small faint">平均配速 ${st.R.length ? fmtPace(sum(st.R, r => r.sec) / st.km) : '–'}</span></section>
      <section class="card tile spot"><span class="tl">運動時間</span><span class="tv">${tick(Math.round(st.sec / 360) / 10, 1)}<span class="unit">小時</span></span><span class="small faint">${nW} 週</span></section>
    </div>
    <section class="card spot"><div class="card-h"><h2 class="sec">每週重訓量</h2><span class="small faint">噸（重量 × 次數，不含熱身）</span></div>
      <div class="chartbox">${barChart({ vals: vols, labels, color: 'var(--lift)', fmt: v => fmtN(v, v % 1 ? 1 : 0), unit: '噸', title: '每週重訓量' })}</div></section>
    <section class="card spot"><div class="card-h"><h2 class="sec">每週跑量</h2><span class="small faint">km</span></div>
      <div class="chartbox">${barChart({ vals: kms, labels, color: 'var(--run)', goal: S.profile.goalKm, fmt: v => fmtN(v, v % 1 && v < 10 ? 1 : 0), unit: 'km', title: '每週跑量' })}</div></section>
    <section class="card spot"><div class="card-h" style="flex-wrap:wrap"><h2 class="sec">估算 1RM 走勢</h2><div id="segLiftSel" style="max-width:100%"></div></div>

      </tbody></table></div></section>`;
  mountSeg('segRange', { items: [{ value: '4w', label: '4 週' }, { value: '12w', label: '12 週' }, { value: 'all', label: '全部' }], value: UI.statsRange, label: '時間範圍', cls: 'seg-sm', onChange: (val, ch) => { if (ch) { UI.statsRange = val; renderStats(false); } } });

  if (anim) { stagger(v); runTickers(v); }
}

/* ---------- Strava: only the short-lived API proxy is trusted with Strava credentials ---------- */
const STRAVA_PREF = 'strava-worker-url';
const STRAVA_SESSION = 'strava-session-v1';
const STRAVA_PENDING = 'kai-strava-pending';
const Strava = (() => {
  let busy = false, athlete = null;
  const getWorker = () => String(Store.get(STRAVA_PREF, '') || '').trim().replace(/\/+$/, '');
  const getSession = () => String(Store.get(STRAVA_SESSION, '') || '');
  function validWorker(url) {
    try { const u = new URL(url); return u.protocol === 'https:' && !u.username && !u.password && !u.search && !u.hash && u.pathname.replace(/\/$/,'') === ''; }
    catch (_) { return false; }
  }
  function setStatus(t, isErr = false) {
    const el = $('#strava-status'); if (!el) return;
    el.textContent = t;
    el.style.color = isErr ? 'var(--bad)' : '';
  }
  function render() {
    const status = $('#strava-status'); if (!status) return;
    const connected = !!getSession();
    status.textContent = connected ? (athlete ? `已連線：${athlete.firstname || ''} ${athlete.lastname || ''}（ID ${athlete.id || '—'}）` : '已記錄 Strava 授權，準備驗證連線') : '尚未連線 · 訓練資料仍可手動記錄';
    $('#strava-connect')?.toggleAttribute('hidden', connected);
    $('#strava-sync')?.toggleAttribute('hidden', !connected);
    $('#strava-disconnect')?.toggleAttribute('hidden', !connected);
    const sync = $('#strava-sync'); if (sync) sync.disabled = busy;
    const c = $('#strava-connect'); if (c) c.disabled = busy;
  }
  function saveWorker() {
    const el = $('#strava-worker'); if (!el) return false;
    const value = el.value.trim().replace(/\/+$/,'');
    if (!validWorker(value)) { setStatus('請輸入 https:// 開頭的 Worker 網址（僅網域，不包含路徑）。',true); el.focus(); return false; }
    const prev = getWorker();
    if (prev !== value && getSession()) { setStatus('目前已連線：請先解除舊連線，再變更 Worker 網址。',true); return false; }
    Store.set(STRAVA_PREF, value); toast('已儲存 Strava 服務網址'); render(); return true;
  }
  async function call(path, method='GET') {
    const worker = getWorker(), sess = getSession();
    if (!validWorker(worker)) throw Error('請先設定 Strava 服務網址');
    if (!sess) throw Error('尚未連線 Strava');
    const resp = await fetch(worker+path, {method,headers:{'Authorization':'Bearer '+sess},cache:'no-store'});
    let body; try { body = await resp.json(); } catch (_) { throw Error('連線服務沒有回傳有效資料'); }
    if (!resp.ok) throw Error(body?.error || `服務暫時無法使用（${resp.status}）`);
    return body;
  }
  function start() {
    const url = $('#strava-worker')?.value.trim().replace(/\/+$/,'') || getWorker();
    if (!validWorker(url)) { setStatus('先展開下方教學，完成 Worker 設定並填入服務網址。',true); $('#strava-worker')?.focus(); return; }
    Store.set(STRAVA_PREF,url);
    if (!crypto?.getRandomValues) { setStatus('目前瀏覽器不支援安全授權，請改用 HTTPS 網站。',true); return; }
    const bytes = new Uint8Array(24); crypto.getRandomValues(bytes);
    const nonce = Array.from(bytes, x=>x.toString(16).padStart(2,'0')).join('');
    try { sessionStorage.setItem(STRAVA_PENDING, nonce); } catch (_) { setStatus('瀏覽器無法建立授權狀態，請關閉無痕模式。',true);return; }
    const loc = new URL('./', location.href).href;
    const route = `${url}/oauth/start?nonce=${encodeURIComponent(nonce)}&return_url=${encodeURIComponent(loc)}`;
    location.assign(route);
  }
  async function status() {
    if (!getSession()) { athlete=null;render();return; }
    try { const info=await call('/api/me');athlete=info.athlete||null;render(); }
    catch(e) { athlete=null;setStatus('連線驗證失敗：'+e.message,true); }
  }
  async function sync() {
    if (busy) return; busy = true; render(); setStatus('正在安全讀取 Strava 跑步與健走活動…');
    try {
      const data = await call('/api/activities');
      if (!Array.isArray(data.activities)) throw Error('無法辨識活動資料');
      let count=0, skip=0;
      for (const a of data.activities) {
        if (!a || !Number.isSafeInteger(+a.id) || !(+a.distance>0) || !(+a.moving_time>0)) {skip++;continue;}
        const type=String(a.sport_type||a.type||'');
        if (!['Run','VirtualRun','TrailRun','Walk','Hike'].includes(type)) continue;
        const id='strava-'+a.id;
        if (S.runs.some(r=>r.id===id || String(r.stravaId||'')===String(a.id))) {skip++;continue;}
        const date=String(a.start_date_local||a.start_date||'').slice(0,10);
        if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) {skip++;continue;}
        const km=Math.round((+a.distance/1000)*100)/100;
        const sec=Math.round(+a.moving_time);
        const walk=['Walk','Hike'].includes(type);
        S.runs.push({ id, stravaId:String(a.id), source:'strava', date, km, sec, type:walk?'walk':'easy', feel:'3', hr:Number.isFinite(+a.average_heartrate)&&+a.average_heartrate>0?Math.round(+a.average_heartrate):null, cad:null, shoe:'', place:'', lat:null, lon:null, time: /^\d{2}:\d{2}/.test(String(a.start_date_local||'').slice(11,16))?String(a.start_date_local).slice(11,16):'', weather:null, note:`Strava 匯入 · ${String(a.name||'運動紀錄').slice(0,100)}`, start:Date.parse(a.start_date||'')||Date.now() });
        count++;
      }
      if (count) commit();
      setStatus(`同步完成：新增 ${count} 筆；已有或略過 ${skip} 筆（僅同步跑步與健走）。`);
      toast(`Strava 同步成功：新增 ${count} 筆`);
    } catch(e) {setStatus('同步失敗：'+e.message,true);toast('Strava 同步失敗');}
    finally{busy=false;const b=$('#strava-sync');if(b)b.disabled=false;}
  }
  async function disconnect() {
    if (busy || !getSession()) return;
    if (!confirm('要解除 Strava 授權嗎？已匯入的跑步紀錄會保留在此裝置。')) return;
    busy=true;render();
    try {
      await call('/api/session','DELETE');
      Store.set(STRAVA_SESSION,'');athlete=null;
      toast('已解除 Strava 授權，已匯入紀錄不受影響');
    } catch(e) {setStatus('解除失敗：'+e.message+'。請重試，或到 Strava 應用程式設定手動撤銷授權。',true);}
    finally { busy=false;render(); }
  }
  function callback() {
    const h=location.hash||'';
    if (h.startsWith('#strava-error=')) {
      const err=decodeURIComponent(h.slice('#strava-error='.length));
      history.replaceState(null,'',location.pathname+location.search);
      toast('Strava 連線未完成：'+err);
      return;
    }
    if (!h.startsWith('#strava-auth=')) return;
    const value=h.slice('#strava-auth='.length);
    history.replaceState(null,'',location.pathname+location.search);
    const split=value.indexOf('.');
    const nonce=value.slice(0,split), key=value.slice(split+1);
    let expected=null;try{expected=sessionStorage.getItem(STRAVA_PENDING);sessionStorage.removeItem(STRAVA_PENDING);}catch(_){}
    if (!expected || expected!==nonce || !/^[a-f0-9]{64}$/.test(key)) {toast('Strava 授權驗證失敗，請重新連線');return;}
    Store.set(STRAVA_SESSION,key);toast('Strava 已授權，可從設定同步跑步資料');
    status();
  }
  return {render,saveWorker,start,status,sync,disconnect,callback,getWorker,getSession};
})();

/* ---------- rest timer ---------- */
const Rest = (() => {
  const el = $('#rest');
  let end = 0, total = 0, iv = 0, fired = false, actx = null, built = false, tEl, sEl, arc;
  const C = 2 * Math.PI * 15;
  function build() {
    if (built) return; built = true;
    el.innerHTML = `<svg class="rg" viewBox="0 0 38 38" aria-hidden="true"><circle cx="19" cy="19" r="15" fill="none" style="stroke:var(--line)" stroke-width="4"/><circle id="restArc" cx="19" cy="19" r="15" fill="none" style="stroke:var(--lift)" stroke-width="4" stroke-linecap="round" stroke-dasharray="${C.toFixed(2)}"/></svg>
      <div class="rt"><b id="restT">0:00</b><span id="restS">組間休息</span></div>
      <button type="button" class="rb" data-act="rest-adj" data-d="-15" aria-label="少 15 秒">−15</button><button type="button" class="rb" data-act="rest-adj" data-d="15" aria-label="多 15 秒">+15</button><button type="button" class="rb" data-act="rest-stop" aria-label="關閉休息計時" style="min-width:34px;display:grid;place-items:center"><span style="width:14px;display:block">${IC.x}</span></button>`;
    tEl = $('#restT', el); sEl = $('#restS', el); arc = $('#restArc', el);
  }
  function audio() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume?.(); } catch (_) { actx = null; } }
  function beep() {
    if (!S.profile.sound || !actx) return;
    try {
      const t0 = actx.currentTime;
      [0, .24].forEach(o => {
        const os = actx.createOscillator(), g = actx.createGain();
        os.type = 'sine'; os.frequency.value = 880;
        g.gain.setValueAtTime(.0001, t0 + o); g.gain.exponentialRampToValueAtTime(.22, t0 + o + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + o + .17);
        os.connect(g).connect(actx.destination); os.start(t0 + o); os.stop(t0 + o + .2);
      });
    } catch (_) { }
  }
  function tickR() {
    const left = Math.max(0, (end - Date.now()) / 1000);
    tEl.textContent = fmtDur(Math.ceil(left));
    arc.setAttribute('stroke-dashoffset', (C * (1 - (total ? left / total : 0))).toFixed(2));
    if (left <= 0 && !fired) {
      fired = true; sEl.textContent = '休息結束'; el.classList.add('done'); beep();
      try { navigator.vibrate?.([120, 80, 120]); } catch (_) { }
      setTimeout(() => { if (fired) stop(); }, 6000);
    }
  }
  function start(sec) {
    build(); audio();
    total = sec; end = Date.now() + sec * 1000; fired = false;
    sEl.textContent = '組間休息'; el.classList.remove('done'); el.hidden = false;
    clearInterval(iv); iv = setInterval(tickR, 250); tickR();
  }
  function stop() { clearInterval(iv); fired = false; el.hidden = true; }
  return {
    start, stop,
    adj(d) { if (el.hidden) return; end += d * 1000; total = Math.max(1, total + d); if (end > Date.now()) { fired = false; el.classList.remove('done'); sEl.textContent = '組間休息'; } tickR(); },
  };
})();

const Wake = (() => {
  let lock = null, want = false;
  async function req() { try { if (want && !lock && navigator.wakeLock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener?.('release', () => { lock = null; }); } } catch (_) { lock = null; } }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) req(); });
  return { on() { want = true; req(); }, off() { want = false; try { lock?.release(); } catch (_) { } lock = null; } };
})();
