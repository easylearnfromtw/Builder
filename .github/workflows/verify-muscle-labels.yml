name: Verify muscle labels
on:
  push:
    branches: [main]
    paths:
      - index.html
      - tests/muscle-labels.cjs
      - tests/muscle-labels-browser.cjs
      - .github/workflows/verify-muscle-labels.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  muscle-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify static muscle label algorithm
        run: node --test tests/muscle-labels.cjs
      # Browser/WebGL checks run once in muscle-labels.yml; this separate
      # workflow checks fast deterministic geometry only.
